name: CI

# Triggers per PROJECT_BRIEF Section 11.2: every PR to main and every push to main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel an in-progress run if a new commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + test (windows-latest, .NET 10)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The .sln does not exist yet — Nova creates it in Phase 1.
      # Every dotnet step is guarded so this workflow runs green on the Phase 0 PR
      # and starts doing real work the moment the .sln lands.
      - name: Restore
        shell: pwsh
        run: |
          if (Test-Path *.sln) {
            dotnet restore
          } else {
            Write-Host "No .sln found — skipping restore (Phase 0 bootstrap PR)."
          }

      - name: Format check
        shell: pwsh
        run: |
          if (Test-Path *.sln) {
            dotnet format --verify-no-changes
          } else {
            Write-Host "No .sln found — skipping format check."
          }

      - name: Build
        shell: pwsh
        run: |
          if (Test-Path *.sln) {
            dotnet build -c Release --no-restore
          } else {
            Write-Host "No .sln found — skipping build."
          }

      - name: Test
        shell: pwsh
        run: |
          if (Test-Path *.sln) {
            dotnet test -c Release --no-build --logger trx
          } else {
            Write-Host "No .sln found — skipping tests."
          }

      - name: Upload TRX results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-trx
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
          retention-days: 14

  publish-smoke:
    name: published EXE smoke (--help, windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Build the SAME single-file artifact the release pipeline ships and prove it runs before any
      # release is trusted: the native AFC DLLs must self-extract (IncludeNativeLibrariesForSelfExtract)
      # and `--help` must exit 0 on a clean runner. Guarded so the Phase 0 bootstrap PR stays green.
      - name: Publish single-file and run --help
        shell: pwsh
        run: |
          if (Test-Path *.sln) {
            dotnet publish src/GetAndSee.Cli -c Release -r win-x64 --self-contained true `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
            $exe = "src/GetAndSee.Cli/bin/Release/net10.0/win-x64/publish/get-and-see.exe"
            if (-not (Test-Path $exe)) { throw "published EXE not found at $exe" }
            & $exe --help
            if ($LASTEXITCODE -ne 0) { throw "published EXE --help failed with exit $LASTEXITCODE" }
            Write-Host "Published single-file EXE ran --help successfully."
          } else {
            Write-Host "No .sln found - skipping publish smoke (Phase 0 bootstrap PR)."
          }

  secret-scan:
    name: gitleaks secret scan (pre-public gate)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pre-public security gate: fail the build on any committed secret (keys, tokens, .pem/.pfx,
      # connection strings). Complements the code-review skill's secrets lens (PROJECT_BRIEF §13.6).
      # We download a pinned official gitleaks binary (no third-party action, no telemetry/license
      # logic) and scan the working tree; --redact ensures a finding is never printed in the log.
      - name: Run gitleaks
        shell: bash
        run: |
          set -euo pipefail
          VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --no-git --redact --verbose --exit-code 1
