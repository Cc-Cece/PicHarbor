name: Deploy Website

# Deploy the static website to GitHub Pages.
# Triggers:
#   push tags 'v*'    - automatically refresh and redeploy website when a new version tag is cut.
#   workflow_dispatch - allow manual re-deployment from Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Stamp release tag metadata
        shell: bash
        run: |
          REF_NAME="${{ github.ref_name }}"
          if [[ "$REF_NAME" == v* ]]; then
            echo "Stamping release tag $REF_NAME into website/version.json"
            python3 -c "import json, datetime; f=open('website/version.json','r+'); d=json.load(f); d['version']='$REF_NAME'; d['published_at']=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'); f.seek(0); json.dump(d, f, indent=2); f.truncate()"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'website'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
