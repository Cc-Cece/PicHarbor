name: Release

# Build the single-file EXE and publish a GitHub Release when a version tag is pushed.
#
# DORMANT until the first `v*` tag is cut. Per docs/sprint-3/plan.md the tag is the deliberate
# LAST step and is NOT cut until QA Stage 2 (#21) signs off PASS — no release on an unverified engine.
#
# GITHUB_TOKEN (github.token) is the only secret required (PROJECT_BRIEF §11.4).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # required to create the GitHub Release and upload assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: build single-file EXE + publish release (win-x64)
    runs-on: windows-latest

    env:
      PUBLISH_CLI: src/PicHarbor.Cli/bin/Release/net10.0/win-x64/publish/picharbor.exe
      PUBLISH_GUI: src/PicHarbor.Gui/bin/Release/net10.0-windows10.0.19041.0/win-x64/publish/PicHarbor.Gui.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags so MinVer derives the version from the release tag

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish compressed portable exes (win-x64)
        shell: pwsh
        run: |
          # Version comes from the git tag via MinVer (the checkout uses fetch-depth: 0 so the tag is
          # visible). A tagged build (e.g. v1.0.2) stamps 1.0.2 into the EXE automatically — no -p:Version.
          # Single-file, compressed, self-contained. Native AFC libraries extract on first start.
          # PublishSingleFile / compression / DebuggerSupport come from the app projects.
          dotnet publish src/PicHarbor.Cli -c Release -r win-x64 --self-contained true
          dotnet publish src/PicHarbor.Gui -c Release -r win-x64 --self-contained true
          if (-not (Test-Path $env:PUBLISH_CLI)) { throw "published CLI not found at $env:PUBLISH_CLI" }
          if (-not (Test-Path $env:PUBLISH_GUI)) { throw "published GUI not found at $env:PUBLISH_GUI" }

      - name: Smoke test the published CLI (--help must run)
        shell: pwsh
        run: |
          # Proves the native AFC DLLs self-extract and the single file actually runs before we
          # trust it in a release (the RID/native-unpack lesson from Sprint 1).
          & $env:PUBLISH_CLI --help
          if ($LASTEXITCODE -ne 0) { throw "published CLI --help failed with exit $LASTEXITCODE" }

      - name: Compute SHA-256
        shell: pwsh
        run: |
          $cliHash = (Get-FileHash $env:PUBLISH_CLI -Algorithm SHA256).Hash.ToLower()
          $guiHash = (Get-FileHash $env:PUBLISH_GUI -Algorithm SHA256).Hash.ToLower()
          # sha256sum-compatible lines: "<hash>  <filename>".
          "$cliHash  picharbor.exe" | Out-File -FilePath "$env:PUBLISH_CLI.sha256" -Encoding ascii
          "$guiHash  PicHarbor.Gui.exe" | Out-File -FilePath "$env:PUBLISH_GUI.sha256" -Encoding ascii
          "CLI_SHA256=$cliHash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GUI_SHA256=$guiHash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "CLI SHA-256: $cliHash"
          Write-Host "GUI SHA-256: $guiHash"

      - name: Create GitHub Release and attach assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          # Build the notes as a string array (one line per element) to avoid PowerShell here-string
          # / backtick fragility inside a YAML block. Plain markdown, no code-span backticks.
          $lines = @(
            "Portable, compressed, self-contained Windows (win-x64) builds of PicHarbor $tag.",
            "Copy one exe. No installer and no separate .NET runtime.",
            "",
            "PicHarbor.Gui.exe is the desktop app. picharbor.exe is the command line.",
            "Backup never writes to the iPhone.",
            "",
            "SHA-256 (picharbor.exe): $env:CLI_SHA256",
            "SHA-256 (PicHarbor.Gui.exe): $env:GUI_SHA256",
            "",
            "Verify your download (PowerShell): (Get-FileHash .\picharbor.exe -Algorithm SHA256).Hash",
            "",
            "See docs/release-notes/ for the full changelog and known limitations."
          )
          Set-Content -Path notes.md -Value $lines -Encoding utf8

          gh release create "$tag" `
            "$env:PUBLISH_CLI" "$env:PUBLISH_CLI.sha256" `
            "$env:PUBLISH_GUI" "$env:PUBLISH_GUI.sha256" `
            --title "$tag" --notes-file notes.md --verify-tag
